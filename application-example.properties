# =========================================================================
# FOODRESCUE AI - EXAMPLE CONFIGURATION TEMPLATE
# Copy this file to application.properties and update the credentials
# =========================================================================

# Application Port
server.port=8080
spring.application.name=ai-food-waste-manager

# Database configuration (Use MySQL docker service name "mysql" or "localhost")
spring.datasource.url=jdbc:mysql://localhost:3306/foodrescue?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=your_database_username_here
spring.datasource.password=your_database_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Schema Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=./uploads

# JWT Security Settings (Must be 256-bit secure key)
jwt.secret=YOUR_JWT_SECRET_KEY_MIN_256_BITS_HEX_GOES_HERE
jwt.expiration-ms=86400000

# Thymeleaf Template Settings
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Settings
logging.level.com.foodrescue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
