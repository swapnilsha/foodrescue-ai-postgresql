# ===============================
# TEST APPLICATION CONFIGURATION
# ===============================
spring.application.name=ai-food-waste-manager-test

# ===============================
# DATABASE CONNECTION (Test Isolated MySQL Database)
# ===============================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/foodrescue_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (Automated Schema Migration)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ===============================
# JWT SECURITY TOKEN SETTINGS
# ===============================
jwt.secret=${TEST_JWT_SECRET:8f4c28a7e0a9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3}
jwt.expiration-ms=86400000

# ===============================
# LOGGING
# ===============================
logging.level.com.foodrescue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
