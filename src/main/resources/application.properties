# APPLICATION
# ===============================
server.port=${PORT:8080}
spring.application.name=ai-food-waste-manager

# ===============================
# DATABASE CONNECTION - POSTGRESQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodrescue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===============================
# FLYWAY (Automated Schema Migration)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ===============================
# FILE UPLOAD SETTINGS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Upload storage directory (relative to project root)
app.upload.dir=./uploads

# Serve uploaded files as static resources
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# ===============================
# JWT SECURITY TOKEN SETTINGS
# ===============================
jwt.secret=${JWT_SECRET:8f4c28a7e0a9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3}
jwt.expiration-ms=86400000

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================
# LOGGING
# ===============================
logging.level.com.foodrescue=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ===============================
# ACTUATOR HEALTH ENDPOINT
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always