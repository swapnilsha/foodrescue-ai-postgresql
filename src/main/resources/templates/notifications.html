<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Center of Notifications')}"></head>
<body>

    <div class="app-wrapper">
        <aside th:replace="~{fragments/sidebar :: sidebar('notifications', 'SHARED')}"></aside>

        <div class="main-container">
            <nav th:replace="~{fragments/navbar :: navbar}"></nav>

            <main class="content-body">
                <div class="mb-5 d-flex justify-content-between align-items-center" data-aos="fade-down">
                    <div>
                        <h2 class="fw-bold mb-1">Global Notifications</h2>
                        <p class="text-muted">Stay connected with the FoodRescue AI ecosystem.</p>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8" data-aos="fade-up">
                        <div class="card-enterprise p-0 overflow-hidden shadow-sm">
                            <div class="p-5 text-center bg-light">
                                <i class="fa-solid fa-bell-concierge display-2 text-primary opacity-25 mb-4"></i>
                                <h4 class="fw-bold">Welcome to the Notification Hub</h4>
                                <p class="text-muted">You will see high-priority alerts here. Currently, your stream is focused on your specific role.</p>
                                <a th:href="'/' + ${#strings.toLowerCase(userRole)} + '/notifications'" class="btn btn-dark px-4 rounded-pill mt-3">Go to <span th:text="${userRole}"></span> Alerts</a>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <nav th:replace="~{fragments/common :: scripts}"></nav>
</body>
</html>
