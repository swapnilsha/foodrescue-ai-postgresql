<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Donation Requests')}"></head>
<body>

    <div class="app-wrapper">
        <aside th:replace="~{fragments/sidebar :: sidebar('requests', 'NGO')}"></aside>

        <div class="main-container">
            <nav th:replace="~{fragments/navbar :: navbar}"></nav>

            <main class="content-body">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-5" data-aos="fade-down">
                    <div>
                        <h2 class="fw-bold mb-1">Donation Requests <i class="fa-solid fa-inbox text-danger ms-2"></i></h2>
                        <p class="text-muted mb-0">Manage all incoming food rescue requests from donors.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <select class="form-select form-select-sm border-0 bg-light" id="filter-status" onchange="filterByStatus()">
                            <option value="">All Status</option>
                            <option value="PENDING">Pending</option>
                            <option value="ACCEPTED">Accepted</option>
                            <option value="ASSIGNED">Assigned</option>
                            <option value="PICKUP_IN_PROGRESS">Pickup In Progress</option>
                            <option value="COLLECTED">Collected</option>
                            <option value="RECEIVED">Received</option>
                            <option value="DELIVERED">Delivered</option>
                            <option value="REJECTED">Rejected</option>
                            <option value="EXPIRED">Expired</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                        <button class="btn btn-outline-dark btn-sm rounded-pill px-3" onclick="loadRequests()">
                            <i class="fa-solid fa-rotate-right me-1"></i>Refresh
                        </button>
                    </div>
                </div>

                <!-- Summary Counts -->
                <div class="row g-3 mb-5" id="summary-cards" data-aos="fade-up">
                    <div class="col-6 col-md-3">
                        <div class="card-enterprise border-0 shadow-sm border-start border-warning border-4 text-center py-3">
                            <div class="h3 fw-bold mb-0" id="cnt-pending">—</div>
                            <div class="small text-muted">Pending</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card-enterprise border-0 shadow-sm border-start border-primary border-4 text-center py-3">
                            <div class="h3 fw-bold mb-0" id="cnt-active">—</div>
                            <div class="small text-muted">In Progress</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card-enterprise border-0 shadow-sm border-start border-success border-4 text-center py-3">
                            <div class="h3 fw-bold mb-0" id="cnt-delivered">—</div>
                            <div class="small text-muted">Delivered</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card-enterprise border-0 shadow-sm border-start border-danger border-4 text-center py-3">
                            <div class="h3 fw-bold mb-0" id="cnt-rejected">—</div>
                            <div class="small text-muted">Rejected</div>
                        </div>
                    </div>
                </div>

                <!-- Requests Table -->
                <div class="card-enterprise shadow-sm" data-aos="fade-up" data-aos-delay="100">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="requests-table">
                            <thead class="bg-light">
                                <tr>
                                    <th class="border-0 px-4">Request ID</th>
                                    <th class="border-0">Food</th>
                                    <th class="border-0">Donor</th>
                                    <th class="border-0">Qty (kg)</th>
                                    <th class="border-0">Pickup Address</th>
                                    <th class="border-0">Requested At</th>
                                    <th class="border-0">Status</th>
                                    <th class="border-0 text-end px-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="requests-tbody">
                                <tr>
                                    <td colspan="8" class="text-center py-5">
                                        <div class="spinner-border text-success me-2" role="status" style="width:1.5rem;height:1.5rem;"></div>
                                        <span class="text-muted">Loading requests...</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-3 border-top d-flex justify-content-between align-items-center">
                        <span class="small text-muted" id="requests-count">Loading...</span>
                        <a href="/ngo/dashboard" class="small text-decoration-none text-primary">← Back to Mission Control</a>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <nav th:replace="~{fragments/common :: scripts}"></nav>
    <script th:src="@{/js/donation-request.js}"></script>
    <script>
        let _allRequests = [];

        async function loadRequests() {
            const tbody = document.getElementById('requests-tbody');
            const countEl = document.getElementById('requests-count');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5">
                <div class="spinner-border text-success me-2" role="status" style="width:1.5rem;height:1.5rem;"></div>
                <span class="text-muted">Loading...</span></td></tr>`;
            try {
                _allRequests = await window.drService.loadNgoRequests();
                updateSummaryCounts(_allRequests);
                renderTable(_allRequests);
                countEl.textContent = `Showing ${_allRequests.length} request${_allRequests.length !== 1 ? 's' : ''}`;
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-danger">Failed to load requests: ${e.message}</td></tr>`;
                countEl.textContent = 'Error loading data';
                console.error('[NGO Requests] Error:', e);
            }
        }

        function updateSummaryCounts(requests) {
            document.getElementById('cnt-pending').textContent   = requests.filter(r => r.status === 'PENDING').length;
            document.getElementById('cnt-active').textContent    = requests.filter(r => ['ACCEPTED','ASSIGNED','PICKUP_IN_PROGRESS','COLLECTED','RECEIVED'].includes(r.status)).length;
            document.getElementById('cnt-delivered').textContent = requests.filter(r => r.status === 'DELIVERED').length;
            document.getElementById('cnt-rejected').textContent  = requests.filter(r => r.status === 'REJECTED').length;
        }

        function filterByStatus() {
            const status = document.getElementById('filter-status').value;
            const filtered = status ? _allRequests.filter(r => r.status === status) : _allRequests;
            renderTable(filtered);
            document.getElementById('requests-count').textContent = `Showing ${filtered.length} request${filtered.length !== 1 ? 's' : ''}`;
        }

        function renderTable(requests) {
            const tbody = document.getElementById('requests-tbody');
            if (!requests.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5">
                    <i class="fa-solid fa-inbox fs-3 text-muted mb-3 d-block"></i>
                    <span class="text-muted">No requests found.</span>
                </td></tr>`;
                return;
            }
            tbody.innerHTML = requests.map(r => `
                <tr id="row-${r.id}">
                    <td class="px-4"><code class="text-primary fw-bold">#REQ-${r.id}</code></td>
                    <td>
                        <div class="fw-semibold">${r.donationTitle}</div>
                        <div class="small text-muted">${r.donationFoodCategory || ''}</div>
                        ${r.donationExpiryTime ? `<div class="small text-danger"><i class="fa-solid fa-clock me-1"></i>Exp: ${window.drService.formatDateTime(r.donationExpiryTime)}</div>` : ''}
                    </td>
                    <td>
                        <div class="fw-semibold">${r.donorName}</div>
                        <div class="small text-muted">${r.donorEmail}</div>
                    </td>
                    <td><span class="fw-bold">${r.donationQuantityKg}</span> <span class="text-muted small">kg</span></td>
                    <td>
                        <div class="small text-truncate" style="max-width:160px;" title="${r.pickupAddress || ''}">
                            ${r.pickupAddress || '<span class="text-muted">—</span>'}
                        </div>
                    </td>
                    <td>
                        <div class="small fw-semibold">${window.drService.formatDateTime(r.requestedAt)}</div>
                        ${r.assignedToName ? `<div class="small text-muted"><i class="fa-solid fa-person-walking me-1"></i>${r.assignedToName}</div>` : ''}
                    </td>
                    <td>${window.drService.statusBadge(r.status)}</td>
                    <td class="px-4 text-end">
                        <div class="d-flex gap-1 justify-content-end flex-wrap">
                            ${window.drService.ngoActionButtons(r)}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadRequests);
    </script>

    <style>
        .badge { font-size: 0.72rem; }
        #requests-table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
    </style>
</body>
</html>
