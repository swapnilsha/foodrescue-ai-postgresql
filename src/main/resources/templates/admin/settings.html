<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Global System Settings')}"></head>
<body>

    <div class="app-wrapper">
        <aside th:replace="~{fragments/sidebar :: sidebar('settings', 'ADMIN')}"></aside>

        <div class="main-container">
            <nav th:replace="~{fragments/navbar :: navbar}"></nav>

            <main class="content-body">
                <div class="mb-5" data-aos="fade-down">
                    <h2 class="fw-bold mb-1">Global System Configuration</h2>
                    <p class="text-muted">Control platform-wide parameters, AI thresholds, and security protocols.</p>
                </div>

                <div class="row g-4">
                    <div class="col-lg-12" data-aos="fade-up">
                        <div class="card-enterprise p-0 overflow-hidden shadow-sm">
                            <div class="nav nav-tabs px-4 pt-3 bg-light border-0">
                                <button class="nav-link active border-0 bg-transparent py-3 fw-bold small uppercase ls-1" data-bs-toggle="tab" data-bs-target="#tab-general">Global Config</button>
                                <button class="nav-link border-0 bg-transparent py-3 fw-bold small uppercase ls-1" data-bs-toggle="tab" data-bs-target="#tab-ai">AI Engine Params</button>
                                <button class="nav-link border-0 bg-transparent py-3 fw-bold small uppercase ls-1" data-bs-toggle="tab" data-bs-target="#tab-api">API & Keys</button>
                            </div>
                            
                            <div class="tab-content p-5 bg-white">
                                <!-- Global Tab -->
                                <div class="tab-pane fade show active" id="tab-general">
                                    <div class="row g-5">
                                        <div class="col-md-6">
                                            <h6 class="fw-bold mb-3">Platform Maintenance</h6>
                                            <div class="d-flex justify-content-between align-items-center mb-4">
                                                <div>
                                                    <div class="fw-bold small">Maintenance Mode</div>
                                                    <p class="extra-small text-muted mb-0">Disable all user access for updates.</p>
                                                </div>
                                                <div class="form-check form-switch fs-5">
                                                    <input class="form-check-input" type="checkbox" id="setting-maintenance">
                                                </div>
                                            </div>
                                            <div class="d-flex justify-content-between align-items-center">
                                                <div>
                                                    <div class="fw-bold small">Debug Logging</div>
                                                    <p class="extra-small text-muted mb-0">Verbose logs for troubleshooting.</p>
                                                </div>
                                                <div class="form-check form-switch fs-5">
                                                    <input class="form-check-input" type="checkbox" id="setting-debug">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <h6 class="fw-bold mb-3">Global Rescue Parameters</h6>
                                            <div class="mb-3">
                                                <label class="form-label small text-muted fw-bold uppercase">Max Search Radius (km)</label>
                                                <input type="number" class="form-control" id="setting-radius" value="50">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label small text-muted fw-bold uppercase">Urgent Pickup Threshold (hrs)</label>
                                                <input type="number" class="form-control" id="setting-threshold" value="4">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-5 pt-4 border-top">
                                        <button class="btn btn-enterprise btn-enterprise-primary px-5" onclick="saveSettings()">Publish System Changes</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <nav th:replace="~{fragments/common :: scripts}"></nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
        });

        async function loadSettings() {
            if (!window.api) return;
            try {
                const settings = await window.api.get('/admin/settings');
                document.getElementById('setting-maintenance').checked = settings.maintenance_mode === 'true';
                document.getElementById('setting-debug').checked = settings.debug_logging === 'true';
                document.getElementById('setting-radius').value = settings.max_search_radius || '50';
                document.getElementById('setting-threshold').value = settings.urgent_pickup_threshold || '4';
            } catch (err) {
                console.error("Failed to load settings:", err);
                if (window.showToast) window.showToast("Failed to load system settings.", "error");
            }
        }

        async function saveSettings() {
            if (!window.api) return;
            const body = {
                maintenance_mode: document.getElementById('setting-maintenance').checked ? 'true' : 'false',
                debug_logging: document.getElementById('setting-debug').checked ? 'true' : 'false',
                max_search_radius: document.getElementById('setting-radius').value,
                urgent_pickup_threshold: document.getElementById('setting-threshold').value
            };

            try {
                await window.api.post('/admin/settings', body);
                if (window.showToast) window.showToast("Settings published and saved to MySQL.", "success");
            } catch (err) {
                console.error("Failed to save settings:", err);
                if (window.showToast) window.showToast("Failed to save settings: " + err.message, "error");
            }
        }
    </script>
    <style>
        .ls-1 { letter-spacing: 0.1em; }
        .nav-tabs .nav-link { color: var(--text-muted); transition: var(--transition); border-bottom: 3px solid transparent !important; }
        .nav-tabs .nav-link.active { color: var(--primary) !important; border-bottom-color: var(--primary) !important; }
        .uppercase { text-transform: uppercase; }
        .extra-small { font-size: 0.65rem; }
    </style>
</body>
</html>
